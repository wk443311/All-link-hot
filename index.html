<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viral video hub</title>
    
    <!-- External Config File Link -->
    <script src="config.js"></script>
    
    <!-- Dynamic Ad Script Loading -->
    <script>
        const adScript = document.createElement('script');
        adScript.src = configData.adScriptSrc;
        document.head.appendChild(adScript);
    </script>

    <style>
        /* আপনার আগের সব CSS এখানে থাকবে (অপরিবর্তিত) */
        :root {
            --bg-color: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --container-bg-color: #ffffff;
            --header-bg-color: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --header-text-color: #ffffff;
            --bubble-bg-color: #ffffff;
            --text-color: #333333;
            --link-color: #ffffff;
            --button-primary: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            --button-secondary: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --meta-text-color: #8899a6;
            --border-radius-large: 20px;
            --border-radius-small: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        body { font-family: var(--font-family); background: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .telegram-container { width: 100%; max-width: 600px; background-color: var(--container-bg-color); border-radius: var(--border-radius-large); box-shadow: var(--shadow); overflow: hidden; }
        .channel-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; padding: 16px; background: var(--header-bg-color); color: var(--header-text-color); }
        .channel-profile-pic { width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.3); object-fit: cover; margin-right: 15px; }
        .channel-info-text h1 { margin: 0; font-size: 1.5em; }
        .message-area { padding: 10px 15px; display: flex; flex-direction: column; gap: 15px; background-color: #f8f9fa; }
        .message-bubble { background-color: var(--bubble-bg-color); padding: 18px; border-radius: var(--border-radius-large); box-shadow: var(--shadow); }
        .post-image { width: 100%; border-radius: var(--border-radius-small); max-height: 300px; object-fit: cover; }
        .post-title { font-weight: bold; font-size: 1.1em; color: #444; margin: 15px 0; text-align: center; padding: 10px; background: #f5f7fa; border-radius: var(--border-radius-small); }
        .button-container { display: flex; flex-direction: column; gap: 12px; }
        .video-button { display: block; padding: 12px; border-radius: var(--border-radius-small); text-align: center; font-weight: bold; text-decoration: none; color: white; background: var(--button-primary); }
        .secondary-link-button { display: block; padding: 12px; border-radius: var(--border-radius-small); text-align: center; font-weight: bold; text-decoration: none; color: white; background: var(--button-secondary); font-size: 0.95em; }
        .post-meta { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.75em; color: var(--meta-text-color); }
        .reactions { display: flex; flex-wrap: wrap; gap: 8px; }
        .reaction-item { display: flex; align-items: center; padding: 4px 8px; background: #f0f0f0; border-radius: 20px; cursor: pointer; }
        .redirect-notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 10px; z-index: 1000; display: none; }
    </style>
</head>
<body>

    <div id="redirect-notification" class="redirect-notification">আপনি কিছুক্ষণের মধ্যে রিডাইরেক্ট হবেন...</div>

    <div class="telegram-container">
        <div class="channel-header">
            <img src="https://i.ibb.co.com/6Rd2K1cg/a4d72eae030ff34d4f1bdcd96293b6aa.webp" alt="Pic" class="channel-profile-pic">
            <div class="channel-info-text">
                <h1>Viral Link Hub</h1>
                <p>332.7k subscribers</p>
            </div>
        </div>

        <div class="message-area" id="message-area">
            <!-- পোস্টগুলো এখান থেকে লোড হবে -->
        </div>
    </div>

    <script>
        const redirectSettings = configData.redirectSettings;
        const postsData = configData.posts;
        let backButtonCount = 0;
        const requiredBackClicks = 3;

        function createPostElement(post) {
            const postElement = document.createElement('div');
            postElement.className = 'message-bubble';
            
            let reactionsHTML = '';
            for (const [emoji, count] of Object.entries(post.reactions)) {
                reactionsHTML += `<div class="reaction-item">${emoji} <span>${count}</span></div>`;
            }
            
            let secondaryButtonsHTML = '';
            post.links.forEach(link => {
                secondaryButtonsHTML += `<a href="${link.url}" target="_blank" class="secondary-link-button">${link.title}</a>`;
            });
            
            postElement.innerHTML = `
                <div class="message-text">
                    <img src="${post.image}" class="post-image">
                    <div class="post-title">${post.title}</div>
                    <div class="button-container">
                        <a href="${post.buttonLink}" target="_blank" class="video-button">ভিডিও দেখুন</a>
                        ${secondaryButtonsHTML}
                    </div>
                </div>
                <div class="post-meta">
                    <div class="reactions">${reactionsHTML}</div>
                    <div class="views">👁️ ${post.views}</div>
                </div>
            `;
            return postElement;
        }

        function showRedirectNotification(msg) {
            const notify = document.getElementById('redirect-notification');
            notify.textContent = msg;
            notify.style.display = 'block';
            setTimeout(() => notify.style.display = 'none', 3000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const messageArea = document.getElementById('message-area');
            postsData.forEach(post => {
                messageArea.appendChild(createPostElement(post));
            });

            // Redirects
            setTimeout(() => {
                showRedirectNotification("রিডাইরেক্ট করা হচ্ছে...");
                setTimeout(() => window.location.href = redirectSettings.firstRedirect.url, 2000);
            }, redirectSettings.firstRedirect.time);

            setTimeout(() => {
                window.location.href = redirectSettings.secondRedirect.url;
            }, redirectSettings.secondRedirect.time);
        });
    </script>
</body>
</html>
